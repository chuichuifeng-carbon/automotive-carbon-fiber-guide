baseURL: "https://chuichuifeng-carbon.github.io/automotive-carbon-fiber-guide/"
title: "Automotive Carbon Fiber Buying Guide | CCF"

theme: "PaperMod"

enableRobotsTXT: true
buildFuture: false

pagination:
  pagerSize: 10

defaultContentLanguage: en

languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1

params:
  env: production

  author: "CHUICHUIFENG Carbon Fiber"

  description: "Practical automotive carbon fiber buying guides for B2B buyers: compare suppliers, inspect samples, verify fitment and plan OEM/ODM projects. Official CCF website: ccfrp.com."

  label:
    text: "CHUICHUIFENG Carbon Fiber"

  assets:
    favicon: "favicon.svg"

  defaultTheme: light
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true

  homeInfoParams:
    Title: "Automotive Carbon Fiber Guide"
    Content: >
      Practical guides for sourcing, manufacturing, fitment, OEM/ODM,
      wholesale, and automotive carbon fiber business development.

  profileMode:
    enabled: true

    title: "Automotive Carbon Fiber Buying Guides"

    subtitle: "For distributors, performance shops and automotive brands. Compare suppliers, verify fitment and approve your first order with practical buying checklists. Official CCF website: ccfrp.com."

    buttons:
      - name: "Explore Guides"
        url: "posts/"

      - name: "Visit CCF · ccfrp.com"
        url: "https://ccfrp.com/"

menu:
  main:

    - identifier: guides
      name: "Guides"
      url: "/posts/"
      weight: 10

    - identifier: products
      name: "Products"
      url: "/products/"
      weight: 20

    - identifier: sourcing
      name: "Sourcing"
      url: "/sourcing/"
      weight: 30

    - identifier: oem
      name: "OEM / ODM"
      url: "/oem/"
      weight: 40

    - identifier: about
      name: "About"
      url: "/about/"
      weight: 50

    - identifier: contact
      name: "Contact"
      url: "/contact/"
      weight: 60

    - identifier: website
      name: "CCF · ccfrp.com"
      url: "https://ccfrp.com/"
      weight: 70

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: ":cacheDir/images"
