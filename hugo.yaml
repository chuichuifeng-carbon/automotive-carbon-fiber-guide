baseURL: "https://chuichuifeng-carbon.github.io/automotive-carbon-fiber-guide/"
title: "Automotive Carbon Fiber Guide | CHUICHUIFENG Carbon Fiber"

theme: "PaperMod"

enableRobotsTXT: true

pagination:
  pagerSize: 10

defaultContentLanguage: en

languages:
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 1

params:
  env: production

  author: "CHUICHUIFENG Carbon Fiber"

  description: "Automotive carbon fiber guides, sourcing insights, OEM/ODM resources, and manufacturing knowledge for global automotive brands."

  label:
    text: "CHUICHUIFENG Carbon Fiber"

  assets:
    favicon: "/favicon.svg"

  defaultTheme: light
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: true

  homeInfoParams:
    Title: "Automotive Carbon Fiber Guide"
    Content: >
      Practical guides for sourcing, manufacturing, fitment, OEM/ODM,
      wholesale, and automotive carbon fiber business development.

  profileMode:
    enabled: true

    title: "Automotive Carbon Fiber Guide"

    subtitle: "Manufacturing insights, fitment guides, sourcing resources, and OEM/ODM knowledge for global automotive brands, distributors, e-commerce sellers, and performance shops."

    buttons:
      - name: "Explore Guides"
        url: "/posts/"

      - name: "Work With Our Factory"
        url: "https://www.ccfrp.com/"

menu:
  main:

    - identifier: guides
      name: "Guides"
      url: "posts/"
      weight: 10

    - identifier: products
      name: "Products"
      url: "/products/"
      weight: 20

    - identifier: sourcing
      name: "Sourcing"
      url: "/sourcing/"
      weight: 30

    - identifier: oem
      name: "OEM / ODM"
      url: "/oem/"
      weight: 40

    - identifier: about
      name: "About"
      url: "/about/"
      weight: 50

    - identifier: contact
      name: "Contact"
      url: "/contact/"
      weight: 60

    - identifier: website
      name: "Our Factory"
      url: "https://www.ccfrp.com/"
      weight: 70

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

caches:
  images:
    dir: ":cacheDir/images"